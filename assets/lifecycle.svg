<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Asset lifecycle state machine" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <clipPath id="clip"><rect width="1200" height="480" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="480" fill="url(#bg)"/>
    <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="2" fill="#5eead4">ASSET LIFECYCLE · ENFORCED BY A DATABASE TRIGGER</text>
    <text x="40" y="64" font-size="12" fill="#94a3b8">Simplified view — every legal transition is listed in the README table. Anything not allowed raises an exception.</text>

    <!-- connectors -->
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M280 140H512"/>
      <path d="M512 164H280"/>
      <path d="M688 140H920"/>
      <path d="M920 164H688"/>
      <path d="M560 188L450 292"/>
      <path d="M360 304L240 188"/>
      <path d="M600 192V288"/>
      <path d="M1010 192V288"/>
    </g>
    <g stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#a)">
      <path d="M1000 352L880 412"/>
      <path d="M640 352L760 412"/>
    </g>

    <!-- travelling packets -->
    <circle r="5" fill="#34d399"><animateMotion dur="3s" repeatCount="indefinite" path="M280 140H512"/></circle>
    <circle r="5" fill="#34d399"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M512 164H280"/></circle>
    <circle r="5" fill="#fbbf24"><animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M688 140H920"/></circle>
    <circle r="5" fill="#34d399"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M920 164H688"/></circle>
    <circle r="5" fill="#38bdf8"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M560 188L450 292"/></circle>
    <circle r="5" fill="#38bdf8"><animateMotion dur="3s" begin="2.2s" repeatCount="indefinite" path="M360 304L240 188"/></circle>
    <circle r="5" fill="#94a3b8"><animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite" path="M600 192V288"/></circle>
    <circle r="5" fill="#ef4444"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M1010 192V288"/></circle>
    <circle r="5" fill="#ef4444"><animateMotion dur="2.4s" begin="0.2s" repeatCount="indefinite" path="M1000 352L880 412"/></circle>
    <circle r="5" fill="#ef4444"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M640 352L760 412"/></circle>

    <!-- nodes -->
    <g font-size="16" font-weight="700" text-anchor="middle">
      <rect x="515" y="118" width="170" height="74" rx="12" fill="#0b2e1f" stroke="#34d399" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></rect>
      <text x="600" y="150" fill="#d1fae5">Available</text><text x="600" y="172" font-size="12" font-weight="400" fill="#6ee7b7">ready to use</text>

      <rect x="105" y="118" width="170" height="74" rx="12" fill="#0c2a43" stroke="#38bdf8"/>
      <text x="190" y="150" fill="#e0f2fe">Allocated</text><text x="190" y="172" font-size="12" font-weight="400" fill="#7dd3fc">one active holder max</text>

      <rect x="925" y="118" width="170" height="74" rx="12" fill="#2a2208" stroke="#fbbf24"/>
      <text x="1010" y="150" fill="#fef3c7">Under Maintenance</text><text x="1010" y="172" font-size="12" font-weight="400" fill="#fcd34d">only after approval</text>

      <rect x="275" y="292" width="170" height="64" rx="12" fill="#241a3d" stroke="#a78bfa"/>
      <text x="360" y="320" fill="#ede9fe">Reserved</text><text x="360" y="341" font-size="12" font-weight="400" fill="#c4b5fd">held for a booking</text>

      <rect x="515" y="292" width="170" height="64" rx="12" fill="#1f2937" stroke="#94a3b8"/>
      <text x="600" y="320" fill="#e5e7eb">Retired</text><text x="600" y="341" font-size="12" font-weight="400" fill="#9ca3af">taken out of service</text>

      <rect x="925" y="292" width="170" height="64" rx="12" fill="#2f1015" stroke="#ef4444"/>
      <text x="1010" y="320" fill="#fecaca">Lost</text><text x="1010" y="341" font-size="12" font-weight="400" fill="#fca5a5">audit: confirmed missing</text>

      <rect x="720" y="412" width="200" height="52" rx="12" fill="#111827" stroke="#ef4444" stroke-dasharray="4 4"/>
      <text x="820" y="436" fill="#fecaca">Disposed</text><text x="820" y="453" font-size="12" font-weight="400" fill="#9ca3af">terminal — no way back</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="16" fill="none" stroke="#334155"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
