<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AssetFlow banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/><stop offset="0.55" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#2dd4bf" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- conveyor of asset tags -->
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700">
      <line x1="0" y1="262" x2="1200" y2="262" stroke="#334155" stroke-width="2"/>
      <line x1="0" y1="270" x2="1200" y2="270" stroke="#334155" stroke-width="1" stroke-dasharray="6 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <g>
        <g transform="translate(0,230)">
          <rect width="96" height="28" rx="6" fill="#0b2e2c" stroke="#5eead4"/><text x="48" y="19" text-anchor="middle" fill="#99f6e4">AF-0001</text>
        </g>
        <g transform="translate(260,230)">
          <rect width="96" height="28" rx="6" fill="#0c2a43" stroke="#38bdf8"/><text x="48" y="19" text-anchor="middle" fill="#bae6fd">AF-0002</text>
        </g>
        <g transform="translate(520,230)">
          <rect width="96" height="28" rx="6" fill="#23204a" stroke="#a5b4fc"/><text x="48" y="19" text-anchor="middle" fill="#e0e7ff">AF-0003</text>
        </g>
        <g transform="translate(780,230)">
          <rect width="96" height="28" rx="6" fill="#0b2e2c" stroke="#5eead4"/><text x="48" y="19" text-anchor="middle" fill="#99f6e4">AF-0004</text>
        </g>
        <g transform="translate(1040,230)">
          <rect width="96" height="28" rx="6" fill="#0c2a43" stroke="#38bdf8"/><text x="48" y="19" text-anchor="middle" fill="#bae6fd">AF-0005</text>
        </g>
        <animateTransform attributeName="transform" type="translate" from="-130 0" to="1070 0" dur="14s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="600" y="130" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="2" fill="url(#title)">AssetFlow
      <animate attributeName="opacity" values="0.92;1;0.92" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#cbd5e1" letter-spacing="3">ENTERPRISE ASSET &amp; RESOURCE MANAGEMENT</text>
    <text x="600" y="205" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" fill="#5eead4" opacity="0.9">register · allocate · book · maintain · audit</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#14b8a6" stroke-opacity="0.4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
